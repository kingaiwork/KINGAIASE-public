name: Repository Quality Zero-Bill

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: '23 */6 * * *'

permissions:
  contents: read

concurrency:
  group: repository-quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: [self-hosted, linux, x64, kingai-vps]
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Public zero-bill/no-authority guard
        shell: bash
        run: |
          set -euo pipefail
          python3 --version
          test ! -f wrangler.toml
          test ! -f wrangler.json
          test ! -f wrangler.jsonc
          ! grep -RIn --exclude-dir=.git -E 'OPENAI_API_KEY|ANTHROPIC_API_KEY|DEEPSEEK_API_KEY|GEMINI_API_KEY|CLOUDFLARE_API_TOKEN|SUPABASE_.*SECRET|r2_buckets|JOBS_QUEUE|JOBS_DLQ|runs-on:[[:space:]]*(ubuntu|windows|macos)|actions/upload-artifact' .
      - name: Validate public repository
        run: python3 scripts/validate_repo.py
