name: Public knowledge boundary

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  public-boundary:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0

      - name: Enforce public-only information boundary
        shell: bash
        run: |
          python3 - <<'PY'
          from __future__ import annotations
          import pathlib, re, sys

          root = pathlib.Path('.')
          self_path = '.github/workflows/public-boundary-check.yml'

          approved_public_repositories = {
              'kingaiwork/KINGAIASE-public',
              'kingaiwork/kingai-global-intelligence',
              'kingaiwork/KINGAIBOT',
              'kingaiwork/KINGAIOS',
              'kingaiwork/tools-public',
              'kingaiwork/jackhaotv-public',
              'kingaiwork/usdxtech-legacy',
              'kingaiwork/kingaiopsfree',
              'kingaiwork/KINGAI-Security-public',
              'kingaiwork/KINGAI-Office-public',
              'kingaiwork/Atalk-TV-public-Atalk.Tv-',
              'kingaiwork/KINGAI-Customer-OS-public',
              'kingaiwork/KINGAI-Pet-public-dog-',
              'kingaiwork/AI-Life-public',
              'kingaiwork/Digital-Life-public',
              'kingaiwork/ZuiMeiTV-public',
              'kingaiwork/KINGAIOPS-public',
          }

          forbidden_basenames = {
              '.env', '.env.local', '.env.production', '.dev.vars',
              'wrangler.toml', 'wrangler.json', 'wrangler.jsonc',
              'docker-compose.yml', 'docker-compose.yaml', 'Dockerfile',
              'terraform.tfstate', '.npmrc',
          }
          forbidden_suffixes = {'.pem', '.key', '.p12', '.pfx', '.tfvars'}
          forbidden_path_parts = {
              'internal', 'private', 'unpublished', 'credentials', 'secrets',
              'migrations', 'collectors', 'scoring', 'adapters',
          }
          patterns = {
              'private-key-material': re.compile(r'-----BEGIN (?:RSA |EC |OPENSSH )?PRIVATE KEY-----', re.I),
              'github-token': re.compile(r'\b(?:ghp_[A-Za-z0-9]{20,}|github_pat_[A-Za-z0-9_]{20,})\b'),
              'secret-assignment': re.compile(r'\b(?:API_KEY|SECRET_KEY|ACCESS_TOKEN|PRIVATE_KEY|DATABASE_URL|WORLD_SECRET|ADMIN_API_TOKEN|STRIPE_SECRET_KEY|STRIPE_WEBHOOK_SECRET|CLOUDFLARE_API_TOKEN|TURNSTILE_SECRET_KEY)\b\s*[:=]\s*["\'][^"\']+["\']', re.I),
              'private-filesystem-path': re.compile(r'/(?:etc|opt|var/lib)/(?:kingai|cloudflared|openclaw)(?:/|\b)', re.I),
              'privileged-command': re.compile(r'\b(?:systemctl|wrangler\s+(?:deploy|d1|kv|r2|pages\s+deploy))\b', re.I),
              'cloudflare-account-api': re.compile(r'api\.cloudflare\.com/client/v4/accounts/', re.I),
              'ssh-port-detail': re.compile(r'\b(?:ssh|vps|server|host)\b.{0,50}\b(?:tcp/|-p\s*)?\d{2,5}\b', re.I | re.S),
              'infrastructure-ip': re.compile(r'\b(?:ssh|vps|server|host|origin)\b.{0,50}\b(?:\d{1,3}\.){3}\d{1,3}\b', re.I | re.S),
              'internal-config-reference': re.compile(r'\b(?:config|infra|docs)/(?:[^\s`]+/)*(?:repository|infrastructure|runtime|resource|deployment|secret|credential)[^\s`]*\.(?:json|ya?ml|md)\b', re.I),
          }
          repo_ref = re.compile(r'\bkingaiwork/[A-Za-z0-9_.-]+\b', re.I)

          findings = []
          for path in root.rglob('*'):
              if not path.is_file() or '.git' in path.parts:
                  continue
              rel = path.as_posix().removeprefix('./')
              if rel == self_path:
                  continue
              if path.name in forbidden_basenames or path.suffix.lower() in forbidden_suffixes:
                  findings.append(('forbidden-sensitive-file', rel))
              if set(path.parts[:-1]) & forbidden_path_parts:
                  findings.append(('forbidden-sensitive-path', rel))
              try:
                  if path.stat().st_size > 2_000_000:
                      continue
                  raw = path.read_bytes()
                  if b'\x00' in raw[:8192]:
                      continue
                  text = raw.decode('utf-8', 'replace')
              except OSError:
                  continue

              for match in repo_ref.finditer(text):
                  ref = match.group(0)
                  if ref.lower() not in {x.lower() for x in approved_public_repositories}:
                      findings.append(('non-public-repository-reference', rel))
                      break
              for rule, pattern in patterns.items():
                  if pattern.search(text):
                      findings.append((rule, rel))

          findings = sorted(set(findings))
          if findings:
              for rule, rel in findings:
                  print(f'FAIL {rule} {rel}', file=sys.stderr)
              print(f'Public boundary failed with {len(findings)} finding(s).', file=sys.stderr)
              raise SystemExit(1)

          print('Public boundary passed: no restricted disclosure detected.')
          PY

      - name: Verify public knowledge structure
        shell: bash
        run: |
          set -euo pipefail
          test -f README.md
          test -f TRUST.md
          test -f customer-knowledge.json
          test -f public-project-facts.json
          test -f llms.txt
          test ! -e .env
          test ! -e .dev.vars
          test ! -e wrangler.jsonc
          test ! -e Dockerfile
