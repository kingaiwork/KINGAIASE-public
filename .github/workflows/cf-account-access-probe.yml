name: Cloudflare Account Access Probe

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/cf-account-access-probe.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: cc658c266bef011a07f83c73379d47e9
    steps:
      - name: Confirm token is available without printing it
        shell: bash
        run: |
          set -euo pipefail
          test -n "${CLOUDFLARE_API_TOKEN:-}"
          python3 - <<'PY'
          import json, os, urllib.request
          account=os.environ['CLOUDFLARE_ACCOUNT_ID']
          token=os.environ['CLOUDFLARE_API_TOKEN']
          req=urllib.request.Request(
              f'https://api.cloudflare.com/client/v4/accounts/{account}/pages/projects?per_page=1',
              headers={'Authorization': f'Bearer {token}', 'User-Agent':'KINGAI-CF-Probe/1.0'}
          )
          with urllib.request.urlopen(req, timeout=30) as r:
              data=json.load(r)
          if data.get('success') is not True:
              raise SystemExit('Cloudflare API probe failed')
          print('Cloudflare Pages account read access confirmed.')
          PY

# Triggered after the workflow already existed on the default branch.
